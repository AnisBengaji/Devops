version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: studentdb
    ports:
      - "3306:3306"
    networks:
      - app-network

  spring-app:
    image: anisbengaji/student-management:latest
    container_name: student-management
    depends_on:
      - mysql
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/studentdb?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: secret
    ports:
      - "8089:8089"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
